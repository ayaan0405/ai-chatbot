<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student AI Chatbot Project</title>
  
  <!-- Markdown parser for nice text formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- PDF.js to read uploaded PDF files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Optional local config for API key (gitignored) -->
  <script src="config.js" onerror="/* optional */"></script>

  <style>
    /* =========================================================
       Student Project Stylesheet - Dark Mode
       Clean, modern, and easy to read
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #090d16;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    /* Main Container (Centered Card) */
    .app-card {
      background: #131b2e;
      width: 100%;
      max-width: 800px;
      height: 90vh;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    /* Header */
    header {
      background: #1a243a;
      border-bottom: 1px solid #23314d;
      color: #f8fafc;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
    }

    header .subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Attached Notes / Document Bar */
    .file-bar {
      background: #0f172a;
      padding: 10px 16px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.85rem;
    }

    .file-input-label {
      background: #1e293b;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #334155;
      transition: all 0.2s;
    }

    .file-input-label:hover {
      background: #27354f;
      color: #ffffff;
      border-color: #475569;
    }

    .file-name {
      color: #34d399;
      font-weight: 500;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-file-btn {
      color: #f87171;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      margin-left: 5px;
    }
    .remove-file-btn:hover {
      text-decoration: underline;
    }

    /* Chat Messages Window */
    .chat-window {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #0b1120;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Welcome message banner */
    .welcome-box {
      background: #131d33;
      border: 1px dashed #2563eb;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-size: 0.9rem;
      color: #93c5fd;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    /* Chat Bubble Styles */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .sender-name {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user .bubble {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message.bot .bubble {
      background: #17223b;
      color: #e2e8f0;
      border-bottom-left-radius: 2px;
      border: 1px solid #233354;
    }

    /* Markdown inside bot bubble */
    .bubble p {
      margin-bottom: 8px;
    }
    .bubble p:last-child {
      margin-bottom: 0;
    }
    .bubble ul, .bubble ol {
      margin-left: 20px;
      margin-bottom: 8px;
    }
    .bubble code {
      background: #233354;
      color: #bfdbfe;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85em;
    }
    .bubble pre {
      background: #090d16;
      color: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid #1e293b;
    }
    .bubble pre code {
      background: transparent;
      color: inherit;
    }

    /* Typing indicator */
    .typing {
      font-style: italic;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* Bottom Input Bar */
    .input-area {
      padding: 14px 20px;
      background: #131b2e;
      border-top: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      padding: 12px 14px;
      background: #0b1120;
      color: #f8fafc;
      border: 1px solid #23314d;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #user-input::placeholder {
      color: #64748b;
    }

    #user-input:focus {
      border-color: #3b82f6;
    }

    #send-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send-btn:hover {
      background: #1d4ed8;
    }

    #send-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #64748b;
    }

    .clear-link {
      color: #f87171;
      cursor: pointer;
      text-decoration: underline;
    }
    .clear-link:hover {
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <!-- Header -->
    <header>
      <div>
        <h1>🎓 My AI Chatbot</h1>
        <div class="subtitle">CS Project • Powered by Google Gemini API</div>
      </div>
    </header>

    <!-- File Upload / Attached Homework Bar -->
    <div class="file-bar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <label class="file-input-label">
          📎 Attach PDF or Notes
          <input type="file" id="file-input" style="display: none;" accept=".pdf,.txt,.md,.py,.js" onchange="handleFile(event)">
        </label>
        <span id="file-status" class="file-name" style="display: none;"></span>
        <button id="remove-file-btn" class="remove-file-btn" style="display: none;" onclick="removeFile()">✕ Remove</button>
      </div>
    </div>

    <!-- Messages Container -->
    <div class="chat-window" id="chat-window">
      <div class="welcome-box" id="welcome-box">
        👋 <b>Hi there! I'm your AI Study Assistant.</b><br>
        Ask me homework questions, help writing essays or code, or upload a <b>PDF / notes</b> to ask questions about it!
      </div>
    </div>

    <!-- Input Box -->
    <div class="input-area">
      <div class="input-row">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Type your question here and press Enter..." 
          onkeydown="if(event.key === 'Enter') sendMessage()"
        >
        <button id="send-btn" onclick="sendMessage()">Send 🚀</button>
      </div>
      <div class="input-footer">
        <span>Remembers conversation context</span>
        <span class="clear-link" onclick="clearChat()">Clear Chat History</span>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // Student Chatbot Project Script
    // Clean and simple JavaScript for Gemini API
    // =========================================================================

    // 1. My API Key (loaded securely from config.js or localStorage)
    let API_KEY = (window.GEMINI_API_KEY && window.GEMINI_API_KEY !== "YOUR_GEMINI_API_KEY_HERE") 
                  ? window.GEMINI_API_KEY 
                  : (localStorage.getItem("gemini_api_key") || "");
    const MODEL_NAME = "gemini-3.8-flash";

    // 2. Chat history array for conversational memory
    let chatHistory = [];

    // 3. Document text if a file is uploaded
    let uploadedDocumentText = "";
    let uploadedDocumentName = "";

    // Set up PDF.js worker
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // 4. Handle file upload (PDF or Text)
    async function handleFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileStatus = document.getElementById('file-status');
      const removeBtn = document.getElementById('remove-file-btn');
      
      fileStatus.textContent = `Reading ${file.name}...`;
      fileStatus.style.display = "inline";

      try {
        if (file.type === "application/pdf" || file.name.endsWith(".pdf")) {
          // Read PDF
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let fullText = "";
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(item => item.str).join(" ") + "\n";
          }
          uploadedDocumentText = fullText;
        } else {
          // Plain text / code file
          uploadedDocumentText = await file.text();
        }

        uploadedDocumentName = file.name;
        fileStatus.textContent = `📎 ${file.name} (Attached)`;
        removeBtn.style.display = "inline";
      } catch (err) {
        alert("Could not read file: " + err.message);
        removeFile();
      }
    }

    // Remove attached file
    function removeFile() {
      uploadedDocumentText = "";
      uploadedDocumentName = "";
      document.getElementById('file-input').value = "";
      document.getElementById('file-status').style.display = "none";
      document.getElementById('remove-file-btn').style.display = "none";
    }

    // 5. Send message function
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      const sendBtn = document.getElementById('send-btn');
      const chatWindow = document.getElementById('chat-window');

      if (!text) return;

      if (!API_KEY) {
        const userKey = prompt("Please enter your Google Gemini API Key to chat:");
        if (userKey && userKey.trim()) {
          API_KEY = userKey.trim();
          localStorage.setItem("gemini_api_key", API_KEY);
        } else {
          return;
        }
      }

      // Hide welcome banner on first question
      const welcome = document.getElementById('welcome-box');
      if (welcome) welcome.style.display = 'none';

      // Append user's message bubble
      appendMessage("You", text, "user");
      input.value = "";
      input.focus();

      // Disable button while waiting for response
      sendBtn.disabled = true;

      // Show typing indicator
      const typingId = "typing-" + Date.now();
      const typingDiv = document.createElement('div');
      typingDiv.className = "message bot";
      typingDiv.id = typingId;
      typingDiv.innerHTML = `
        <span class="sender-name">Gemini Bot</span>
        <div class="bubble typing">Thinking...</div>
      `;
      chatWindow.appendChild(typingDiv);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      // Build the prompt (include document if attached)
      let promptToSend = text;
      if (uploadedDocumentText) {
        promptToSend = `[Attached Document: ${uploadedDocumentName}]\n${uploadedDocumentText}\n\n[User Question]: ${text}`;
      }

      // Add user turn to conversation history
      chatHistory.push({
        role: "user",
        parts: [{ text: promptToSend }]
      });

      try {
        // Call Google Gemini API
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: chatHistory,
            systemInstruction: {
              parts: [{ text: "You are a friendly, helpful AI study assistant. Keep answers clear, accurate, and easy to understand for students." }]
            }
          })
        });

        // Remove typing indicator
        document.getElementById(typingId)?.remove();

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error?.message || "Failed to get reply from Gemini.");
        }

        const data = await response.json();
        const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't understand that.";

        // Append bot reply bubble
        appendMessage("Gemini Bot", replyText, "bot");

        // Save bot turn in history so it remembers next time!
        chatHistory.push({
          role: "model",
          parts: [{ text: replyText }]
        });

      } catch (err) {
        document.getElementById(typingId)?.remove();
        appendMessage("Gemini Bot", "⚠️ Error: " + err.message, "bot");
      } finally {
        sendBtn.disabled = false;
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
    }

    // 6. Helper: Add a bubble to chat window
    function appendMessage(sender, text, type) {
      const chatWindow = document.getElementById('chat-window');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;

      // Convert markdown for bot, escape for user
      const formattedContent = (type === "bot") ? marked.parse(text) : escapeHtml(text);

      msgDiv.innerHTML = `
        <span class="sender-name">${sender}</span>
        <div class="bubble">${formattedContent}</div>
      `;

      chatWindow.appendChild(msgDiv);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // 7. Clear chat function
    function clearChat() {
      chatHistory = [];
      const chatWindow = document.getElementById('chat-window');
      chatWindow.innerHTML = `
        <div class="welcome-box" id="welcome-box">
          🧹 <b>Chat history cleared!</b> Ask a new question to start over.
        </div>
      `;
    }

    // Escape HTML to prevent injection
    function escapeHtml(str) {
      const p = document.createElement('p');
      p.textContent = str;
      return p.innerHTML;
    }
  </script>
</body>
</html>
